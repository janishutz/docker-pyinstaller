name: Create and publish build container
on:
  workflow_dispatch:
jobs:
  build_container:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Login to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build docker image
        run: docker buildx build . --tag ghcr.io/janishutz/docker-pyinstaller
      - name: Publish the container to GitHub Container Registry
        run: |
          docker push ghcr.io/janishutz/docker-pyinstaller
